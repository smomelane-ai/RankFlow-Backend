<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankFlow - Taxi Logistics Engine</title>
    <style>
        body { font-family: sans-serif; background-color: #111827; color: #f3f4f6; padding: 20px; max-width: 600px; margin: 0 auto; }
        .card { background-color: #1f2937; border: 1px solid #374151; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background-color: #0f172a; color: white; border: 1px solid #374151; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #f59e0b; color: #111827; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #d97706; }
        button:disabled { opacity: .5; cursor: wait; }
        .success-box { padding: 10px; background-color: #064e3b; color: #34d399; border-radius: 4px; margin-top: 10px; display: none; text-align: center; }
        .error-box { padding: 10px; background-color: #4c0519; color: #f43f5e; border-radius: 4px; margin-top: 10px; display: none; text-align: center; }
    </style>
</head>
<body>

    <h1>RankFlow Live Terminal</h1>
    <p id="serverStatus" style="color: #f59e0b;">● Server Status: Checking...</p>

    <!-- LOGIN SCREEN -->
    <div id="authCard" class="card">
        <h2>Driver Access Portal</h2>
        <p style="color: #9ca3af; font-size: 14px;">Verify your system PIN to log in.</p>

        <label>Driver ID / License Number</label>
        <input type="text" id="driverIdInput" placeholder="e.g., DRV001">

        <label>Security PIN Code</label>
        <input type="password" id="pinInput" placeholder="••••" maxlength="4" inputmode="numeric">

        <button onclick="handleVerifyPin(this)">Verify Terminal access</button>
        <div id="authMessage" class="error-box"></div>
    </div>

    <!-- WORKSPACE -->
    <div id="workspace" style="display: none;">

        <div class="card" style="background-color: #111827; text-align: center; border: 2px solid #f59e0b;">
            <h3 style="color: #9ca3af; margin: 0;">Available Commuter Balance</h3>
            <p style="font-size: 40px; font-weight: bold; margin: 10px 0; color: white;" id="walletDisplay">R 0.00</p>
            <p style="color: #f59e0b; font-size: 12px; margin: 0;">Standard R 2.00 deduction applies upon dispatch.</p>
        </div>

        <div class="card">
            <h3>Top-Up Smart Wallet</h3>
            <input type="number" id="topupAmount" placeholder="Amount (R)">
            <button onclick="handleTopup(this)" style="background-color: #4b5563; color: white;">Load Funds</button>
            <div id="walletMessage" class="success-box"></div>
        </div>

        <div class="card">
            <h2>Log Active Queue Dispatch</h2>
            <label>Select Transit Route</label>
            <select id="routeSelect">
                <option value="Durban to Inanda">Durban to Inanda</option>
                <option value="Umlazi to CBD">Umlazi to CBD</option>
                <option value="Pinetown to KwaMashu">Pinetown to KwaMashu</option>
            </select>

            <label>Taxi Vehicle Fleet ID</label>
            <input type="text" id="taxiIdInput" placeholder="e.g., ND-887-231">

            <button onclick="handleDispatch(this)" style="background-color: #059669; color: white;">Confirm Dispatch Logs</button>
            <div id="dispatchMessage" class="success-box"></div>
        </div>

    </div>

    <script>
        // Must be the exact URL shown at the top of your backend service in the Render dashboard.
        const BACKEND_URL = "https://rankflow-backend-1.onrender.com"
        let activeUserId = "";
        const $ = (id) => document.getElementById(id);

        // Show a green (ok) or red (error) message in a message box
        function say(id, text, ok) {
            const el = $(id);
            el.className = ok ? 'success-box' : 'error-box';
            el.innerText = text;
            el.style.display = 'block';
        }

        // POST helper: waits up to 70s (Render free plan can be asleep) and never throws
        async function api(path, body) {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), 70000);
            try {
                const res = await fetch(BACKEND_URL + path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    signal: ctl.signal
                });
                const data = await res.json().catch(() => ({}));
                return { ok: res.ok, status: res.status, data };
            } catch (e) {
                return { ok: false, status: 0, data: {}, network: true };
            } finally {
                clearTimeout(timer);
            }
        }

        // Real server status (needs the GET /health route on the backend)
        async function checkServer() {
            const el = $('serverStatus');
            el.style.color = '#f59e0b';
            el.innerText = '● Server Status: Waking up (can take up to 60 seconds)...';
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), 70000);
            try {
                const r = await fetch(BACKEND_URL + '/health', { signal: ctl.signal });
                if (!r.ok) throw new Error('bad status');
                el.style.color = '#10b981';
                el.innerText = '● Server Status: Connected';
            } catch (e) {
                el.style.color = '#f43f5e';
                el.innerText = '● Server Status: Cannot reach server (check the backend URL)';
            } finally {
                clearTimeout(timer);
            }
        }
        checkServer();

        async function handleVerifyPin(btn) {
            const userId = $('driverIdInput').value.trim();
            const pin = $('pinInput').value.trim();
            $('authMessage').style.display = 'none';

            if (!userId || !pin) { say('authMessage', 'Please fill in both Driver ID and PIN', false); return; }

            btn.disabled = true;
            const r = await api('/api/auth/verify-pin', { userId, pin });
            btn.disabled = false;

            if (r.network) return say('authMessage', 'Cannot reach the server. Wait 60 seconds if it was asleep, then try again.', false);
            if (r.status === 401 || r.status === 404) return say('authMessage', r.data.message || 'Wrong ID or PIN', false);
            if (!r.ok) return say('authMessage', 'Server error (' + r.status + ')', false);

            activeUserId = userId;
            $('authCard').style.display = 'none';
            $('workspace').style.display = 'block';
            $('walletDisplay').innerText = 'R ' + parseFloat(r.data.balance).toFixed(2);
        }

        async function handleTopup(btn) {
            const amount = $('topupAmount').value;
            $('walletMessage').style.display = 'none';
            if (!amount || amount <= 0) { say('walletMessage', 'Enter a valid amount', false); return; }

            btn.disabled = true;
            const r = await api('/api/wallet/topup', { userId: activeUserId, amount });
            btn.disabled = false;

            if (r.network) return say('walletMessage', 'Network error during top-up. Try again.', false);
            if (!r.ok || !r.data.success) return say('walletMessage', r.data.error || r.data.message || 'Top-up failed (' + r.status + ')', false);

            $('walletDisplay').innerText = 'R ' + parseFloat(r.data.balance).toFixed(2);
            say('walletMessage', 'Funds successfully deposited into cloud ledger.', true);
            $('topupAmount').value = '';
        }

        async function handleDispatch(btn) {
            const route = $('routeSelect').value;
            const taxiId = $('taxiIdInput').value.trim();
            $('dispatchMessage').style.display = 'none';
            if (!taxiId) { say('dispatchMessage', 'Please provide a Fleet ID', false); return; }

            btn.disabled = true; // stops double-tap logging the same dispatch twice
            const r = await api('/api/queue/dispatch', { route, taxiId, userId: activeUserId });
            btn.disabled = false;

            if (r.network) return say('dispatchMessage', 'Server synchronization error. Try again.', false);
            if (!r.ok || !r.data.success) return say('dispatchMessage', r.data.error || r.data.message || 'Dispatch failed (' + r.status + ')', false);

            // The server should return the new balance once it deducts the R2.00 fee
            if (typeof r.data.balance === 'number') $('walletDisplay').innerText = 'R ' + r.data.balance.toFixed(2);
            say('dispatchMessage', 'Success! Fleet ' + taxiId + ' dispatched on ' + route + '.', true);
            $('taxiIdInput').value = '';
        }
    </script>
</body>
</html>
