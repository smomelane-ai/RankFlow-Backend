<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankFlow - Taxi Logistics Engine</title>
    <style>
        body { font-family: sans-serif; background-color: #111827; color: #f3f4f6; padding: 20px; max-width: 600px; margin: 0 auto; }
        .card { background-color: #1f2937; border: 1px solid #374151; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background-color: #0f172a; color: white; border: 1px solid #374151; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #f59e0b; color: #111827; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #d97706; }
        .success-box { padding: 10px; background-color: #064e3b; color: #34d399; border-radius: 4px; margin-top: 10px; display: none; text-align: center; }
        .error-box { padding: 10px; background-color: #4c0519; color: #f43f5e; border-radius: 4px; margin-top: 10px; display: none; text-align: center; }
    </style>
</head>
<body>

    <h1>RankFlow Live Terminal</h1>
    <p style="color: #10b981;">● Server Status: Connected</p>

    <!-- 🔑 LOGIN SCREEN -->
    <div id="authCard" class="card">
        <h2>Driver Access Portal</h2>
        <p style="color: #9ca3af; font-size: 14px;">Verify your system PIN to log in.</p>
        
        <label>Driver ID / License Number</label>
        <input type="text" id="driverIdInput" placeholder="e.g., DRV001">
        
        <label>Security PIN Code</label>
        <input type="password" id="pinInput" placeholder="••••" maxlength="4">
        
        <button onclick="handleVerifyPin()">Verify Terminal access</button>
        <div id="authMessage" class="error-box"></div>
    </div>

    <!-- 🏎️ WORKSPACE -->
    <div id="workspace" style="display: none;">
        
        <div class="card" style="background-color: #111827; text-align: center; border: 2px solid #f59e0b;">
            <h3 style="color: #9ca3af; margin: 0;">Available Commuter Balance</h3>
            <p style="font-size: 40px; font-weight: bold; margin: 10px 0; color: white;" id="walletDisplay">R 0.00</p>
            <p style="color: #f59e0b; font-size: 12px; margin: 0;">Standard R 2.00 deduction applies upon dispatch.</p>
        </div>

        <div class="card">
            <h3>Top-Up Smart Wallet</h3>
            <input type="number" id="topupAmount" placeholder="Amount (R)">
            <button onclick="handleTopup()" style="background-color: #4b5563; color: white;">Load Funds</button>
            <div id="walletMessage" class="success-box"></div>
        </div>

        <div class="card">
            <h2>Log Active Queue Dispatch</h2>
            <label>Select Transit Route</label>
            <select id="routeSelect">
                <option value="Durban to Inanda">Durban to Inanda</option>
                <option value="Umlazi to CBD">Umlazi to CBD</option>
                <option value="Pinetown to KwaMashu">Pinetown to KwaMashu</option>
            </select>
            
            <label>Taxi Vehicle Fleet ID</label>
            <input type="text" id="taxiIdInput" placeholder="e.g., ND-887-231">
            
            <button onclick="handleDispatch()" style="background-color: #059669; color: white;">Confirm Dispatch Logs</button>
            <div id="dispatchMessage" class="success-box"></div>
        </div>

    </div>

    <script>
        // 📡 LINK TO YOUR NEW WEB SERVICE ADDRESS
        const BACKEND_URL = "https://rankflow-backend-1.onrender.com";
        let activeUserId = "";

        function showError(msg) {
            const msgEl = document.getElementById('authMessage');
            msgEl.innerText = msg;
            msgEl.style.display = 'block';
        }

        async function handleVerifyPin() {
            const userId = document.getElementById('driverIdInput').value.trim();
            const pin = document.getElementById('pinInput').value.trim();
            document.getElementById('authMessage').style.display = 'none';

            if (!userId || !pin) {
                showError('Please fill in both Driver ID and PIN');
                return;
            }

            try {
                const res = await fetch(BACKEND_URL + "/api/auth/verify-pin", {
                    method: "POST", 
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId, pin })
                });
                
                const data = await res.json().catch(() => ({}));
                
                if (res.status === 401 || res.status === 404) {
                    return showError(data.message || "Wrong ID or PIN");
                }
                if (!res.ok) {
                    return showError("Server error (" + res.status + ")");
                }

                // Success block
                activeUserId = userId;
                document.getElementById('authCard').style.display = 'none';
                document.getElementById('workspace').style.display = 'block';
                document.getElementById('walletDisplay').innerText = `R ${parseFloat(data.balance).toFixed(2)}`;
                
            } catch (e) {
                showError("Cannot reach the server. Wait 60 seconds if it was asleep, then try again.");
            }
        }

        async function handleTopup() {
            const amount = document.getElementById('topupAmount').value;
            const msgEl = document.getElementById('walletMessage');
            msgEl.style.display = 'none';

            if (!amount || amount <= 0) {
                alert('Enter a valid amount');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/wallet/topup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: activeUserId, amount })
                });
                const result = await response.json();

                if (result.success) {
                    document.getElementById('walletDisplay').innerText = `R ${parseFloat(result.balance).toFixed(2)}`;
                    msgEl.innerText = 'Funds successfully deposited into cloud ledger.';
                    msgEl.style.display = 'block';
                    document.getElementById('topupAmount').value = '';
                }
            } catch (err) {
                alert('Network error during topup.');
            }
        }

        async function handleDispatch() {
            const route = document.getElementById('routeSelect').value;
            const taxiId = document.getElementById('taxiIdInput').value.trim();
            const msgEl = document.getElementById('dispatchMessage');
            msgEl.style.display = 'none';

            if (!taxiId) {
                alert('Please provide a Fleet ID');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/queue/dispatch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ route, taxiId })
                });
                const result = await response.json();

                if (result.success) {
                    msgEl.innerText = `Success! Fleet ${taxiId} dispatched on ${route}.`;
                    msgEl.style.display = 'block';
                    document.getElementById('taxiIdInput').value = '';
                }
            } catch (err) {
                alert('Server synchronization error.');
            }
        }
    </script>
</body>
</html>
