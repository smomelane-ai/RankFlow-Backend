<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RankFlow</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RankFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#111827;--card:#1f2937;--line:#374151;--ink:#f3f4f6;--mute:#9ca3af;--g:#059669;--gd:#047857;--a:#f59e0b;--r:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:90px}
button,input,select{font:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-weight:900;font-size:1.2rem}.brand b{color:var(--a)}
main{max-width:980px;margin:0 auto;padding:14px}
h2{margin:16px 0 8px;font-size:1.3rem}
.mute{color:var(--mute);font-size:.9rem}
#status{font-size:.8rem}
#offlineBar{display:none;background:#4c0519;color:#fecdd3;padding:8px;text-align:center;font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px}
.field{width:100%;padding:12px;margin:6px 0;background:#0f172a;color:var(--ink);border:2px solid var(--line);border-radius:10px;min-height:50px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:10px 18px;border:0;border-radius:12px;font-weight:800;font-size:1.05rem;cursor:pointer;color:#fff;background:#4b5563;box-shadow:0 4px 0 #1f2937;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 #000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.field:focus-visible{outline:4px solid var(--a);outline-offset:2px}
.btn.g{background:var(--g);box-shadow:0 4px 0 var(--gd)}.btn.a{background:var(--a);color:#111827;box-shadow:0 4px 0 #b45309}.btn.r{background:var(--r);box-shadow:0 4px 0 #991b1b}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.95rem}.btn.wide{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.q{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px}
.q.head{border-color:var(--g)}
.num{width:58px;height:58px;border-radius:12px;background:var(--a);color:#111827;font-size:1.8rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.info{flex:1;min-width:130px}.plate{font-size:1.2rem;font-weight:900}
.tag{display:inline-block;padding:2px 10px;border-radius:8px;font-size:.8rem;font-weight:800;background:#064e3b;color:#34d399}
.tag.Offered{background:#78350f;color:#fcd34d}.tag.Break{background:#4c0519;color:#fda4af}.tag.Dispatched{background:#374151;color:#d1d5db}
.hero{background:#0b1220;border:3px solid var(--a);border-radius:20px;padding:20px;text-align:center;margin:12px 0}
.big{font-size:5.5rem;font-weight:900;line-height:1;color:var(--a)}
.lbl{letter-spacing:.15em;font-weight:800;font-size:.8rem;color:var(--mute)}
.amt{font-size:2.4rem;font-weight:900}
.banner{background:var(--r);color:#fff;font-weight:800;border-radius:10px;padding:10px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.form{display:grid;gap:8px;max-width:520px}
.ok{background:#064e3b;border:2px solid var(--g);border-radius:12px;padding:12px;margin:10px 0;font-weight:700}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;user-select:all}
.line{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}
.wk div{background:#0f172a;border-radius:8px;padding:4px 0;font-size:.8rem}.wk b{display:block;font-size:1.1rem;color:var(--a)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;min-height:60px;padding:0 24px}
#toast{position:fixed;left:50%;top:12px;transform:translate(-50%,-160%);background:#fff;color:#111827;font-weight:800;padding:12px 18px;border-radius:10px;z-index:80;transition:transform .25s}
#toast.on{transform:translate(-50%,0)}
/* PIN pad */
#pin{position:fixed;inset:0;background:rgba(2,6,23,.94);display:none;align-items:flex-end;justify-content:center;z-index:50}
#pin.on{display:flex}
.sheet{width:100%;max-width:420px;background:#0b1220;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;animation:up .28s ease-out}
#pin.out .sheet{transform:translateY(110%);transition:transform .3s ease-in}
.sheet.shake{animation:shake .45s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
.deny{background:var(--r);color:#fff;font-weight:900;border-radius:10px;padding:10px;margin:0 0 12px;visibility:hidden}.deny.on{visibility:visible}
.dots{display:flex;justify-content:center;gap:16px;margin:6px 0 18px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid #64748b}.dots i.f{background:#34d399;border-color:#34d399}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.key{min-height:68px;font-size:1.8rem;font-weight:900;border:0;border-radius:18px;background:#1e293b;color:#fff;box-shadow:0 5px 0 #020617;cursor:pointer;touch-action:manipulation}
.key:active{transform:translateY(5px);box-shadow:0 0 0 #020617;background:#334155}.key.fn{background:#7c2d12;font-size:1.3rem}
/* Dispatch alert */
#alertBox{position:fixed;inset:0;background:#047857;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;z-index:70}
#alertBox.on{display:flex}
#alertSecs{font-size:7rem;font-weight:900;line-height:1}#alertSecs.low{color:#fcd34d}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.shake,#pin.out .sheet,#toast{animation:none;transition:none}}
</style>
</head>
<body>
<div id="offlineBar">You are offline. RankFlow needs a connection.</div>
<header class="top"><span class="brand">Rank<b>Flow</b></span><span id="status" class="mute">Checking server...</span><span id="who"></span></header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<div id="pin" role="dialog" aria-modal="true" aria-label="Security PIN">
 <div class="sheet" id="sheet">
  <p class="lbl">SECURITY PIN</p>
  <p id="pdesc" style="font-size:1.15rem;font-weight:800;margin:6px 0 10px"></p>
  <p class="deny" id="deny" role="alert">Access Denied: Wrong ID or PIN</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="keys" id="keys"></div>
  <button class="btn r wide" data-a="pcancel">Cancel</button>
 </div>
</div>

<div id="alertBox" role="alertdialog" aria-modal="true">
 <p class="lbl" style="color:#d1fae5">DISPATCH ALERT</p>
 <p id="alertPlate" style="font-size:1.4rem;font-weight:900;margin:0"></p>
 <p id="alertSecs">2:00</p>
 <p class="mute" style="color:#d1fae5">A R2.00 rank fee is taken from your wallet when you accept.</p>
 <div style="display:grid;gap:12px;width:100%;max-width:320px">
  <button class="btn wide" style="background:#fff;color:#065f46;font-size:1.3rem" data-a="accept">ACCEPT TRIP</button>
  <button class="btn r wide" style="font-size:1.3rem" data-a="reject">REJECT</button>
 </div>
</div>

<script>
const BACKEND_URL = "https://rankflow-backend-1.onrender.com";
const ROUTES = ['Durban to Inanda', 'Durban to KwaMashu', 'Umlazi to CBD', 'Pinetown to KwaMashu'];
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const rand = (n) => 'R ' + Number(n).toFixed(2);

const S = { user: null, token: '', balance: 0, route: ROUTES[0], droute: ROUTES[0], queue: [], recent: [], addOpen: false, err: '', uid: '', sig: '', offerEnd: 0, busy: false, od: '', odata: null, tab: 'users', ausers: [], abatches: [], apays: [], aout: '' };

/* ---------- Server calls ---------- */
async function api(method, path, body) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 70000); // a sleeping free server can take a minute
    try {
        const res = await fetch(BACKEND_URL + path, {
            method, signal: ctl.signal,
            headers: Object.assign({ 'Content-Type': 'application/json' }, S.token ? { Authorization: 'Bearer ' + S.token } : {}),
            body: body ? JSON.stringify(body) : undefined
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401 && S.token && path !== '/api/auth/verify-pin') { logout('Your session ended. Please log in again.'); return { ok: false, status: 401, data }; }
        return { ok: res.ok, status: res.status, data };
    } catch (e) { return { ok: false, status: 0, data: {}, network: true }; }
    finally { clearTimeout(timer); }
}
function toast(t) { const e = $('toast'); e.textContent = t; e.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => e.className = '', 2500); }
function fail(r, fallback) { return r.network ? 'Cannot reach the server. Check your connection.' : (r.data.error || r.data.message || fallback || 'Something went wrong'); }

async function checkServer() {
    const el = $('status'); el.style.color = '#f59e0b'; el.textContent = 'Waking server...';
    try { const r = await fetch(BACKEND_URL + '/health'); if (!r.ok) throw 0; el.style.color = '#10b981'; el.textContent = '● Connected'; }
    catch (e) { el.style.color = '#f43f5e'; el.textContent = '● Cannot reach server'; }
}

/* ---------- Session ---------- */
function save() { sessionStorage.setItem('rf', JSON.stringify({ user: S.user, token: S.token, balance: S.balance, droute: S.droute, route: S.route })); }
function logout(msg) {
    S.user = null; S.token = ''; S.queue = []; S.recent = []; S.err = msg || ''; S.offerEnd = 0; $('alertBox').className = '';
    sessionStorage.removeItem('rf'); render();
}

/* ---------- Views ---------- */
function loginView() {
    return '<div class="card" style="max-width:420px;margin:24px auto"><h2 style="margin-top:0">Driver and Manager Login</h2><p class="mute">Enter your ID, then your 4-digit PIN.</p>' +
        '<input class="field" id="uid" placeholder="ID, e.g. DRV001" autocapitalize="characters" autocomplete="off" value="' + esc(S.uid) + '">' +
        (S.err ? '<p class="banner" role="alert">' + esc(S.err) + '</p>' : '') +
        '<button class="btn a wide" data-a="enterPin">Enter PIN</button></div>';
}
function routeSelect(id, sel, disabled) {
    return '<label><b>Route</b><select class="field" id="' + id + '" data-a="' + id + '"' + (disabled ? ' disabled' : '') + '>' +
        ROUTES.map((r) => '<option' + (r === sel ? ' selected' : '') + '>' + r + '</option>').join('') + '</select></label>';
}
function managerView() {
    const head = S.queue.find((e) => e.status === 'In Queue'), offered = S.queue.some((e) => e.status === 'Offered');
    let h = routeSelect('mroute', S.route) + '<h2>Live Taxi Queue (' + S.queue.length + ')</h2>';
    if (S.err) h += '<p class="banner" role="alert">' + esc(S.err) + '</p>';
    if (S.addOpen) h += '<div class="card" style="margin:10px 0"><b>Add taxi to queue</b><input class="field" id="np" placeholder="Number plate, e.g. ND 123-456" autocapitalize="characters"><input class="field" id="nd" placeholder="Driver name (optional)"><div class="row"><button class="btn sm" data-a="addCancel">Cancel</button><button class="btn g sm" data-a="addOk">Add to queue</button></div></div>';
    if (!S.queue.length) h += '<p class="mute">No taxis waiting on this route.</p>';
    h += '<div class="grid">' + S.queue.map((e, i) =>
        '<article class="q' + (e === head ? ' head' : '') + '"><div class="num">' + (i + 1) + '</div><div class="info"><div class="plate">' + esc(e.plate) + '</div><div class="mute">' + esc(e.driver_name) + '</div><span class="tag ' + e.status.replace(' ', '') + '">' + e.status + (e.status === 'Offered' ? ' · ' + mmss(e.secondsLeft) : '') + '</span></div>' +
        (e === head ? '<button class="btn g" data-a="dispatchNext"' + (offered || S.busy ? ' disabled' : '') + '>Dispatch Next</button>' : '') +
        (e.status === 'Offered' ? '<button class="btn r sm" data-a="skip" data-v="' + e.id + '">Skip</button>' : '') +
        (e.status !== 'Offered' ? '<button class="btn a sm" data-a="brk" data-v="' + e.id + '">' + (e.status === 'Break' ? 'Back in queue' : 'Break') + '</button><button class="btn sm" data-a="remove" data-v="' + e.id + '">Remove</button>' : '') + '</article>').join('') + '</div>';
    if (S.recent.length) h += '<h2>Dispatched</h2><div class="grid">' + S.recent.map((e) => '<article class="q"><div class="info"><div class="plate">' + esc(e.plate) + '</div><div class="mute">' + esc(e.driver_name) + '</div><span class="tag Dispatched">Dispatched</span></div><button class="btn sm" data-a="rejoin" data-v="' + e.id + '">Rejoin queue</button></article>').join('') + '</div>';
    return h + '<button class="btn g fab" data-a="addOpen">+ Add Taxi</button>';
}
function driverView() {
    const mine = S.queue.find((e) => e.driver_id === S.user.id), pos = mine ? S.queue.indexOf(mine) + 1 : 0;
    const gone = !mine && S.recent.find((e) => e.driver_id === S.user.id);
    let h = '';
    if (mine) h += '<div class="hero"><p class="lbl">' + esc(mine.route.toUpperCase()) + '</p><p class="lbl">YOUR POSITION</p><div class="big">#' + pos + '</div><p>' + (pos === 1 ? 'You are next!' : (pos - 1) + ' taxi' + (pos > 2 ? 's' : '') + ' ahead of you') + '</p>' + (mine.status === 'Break' ? '<p class="banner" style="background:#b45309">On break. Your place is held.</p>' : '') + '</div>';
    else if (gone) h += '<div class="hero"><p class="lbl">STATUS</p><div class="big" style="font-size:2.6rem">DISPATCHED</div><p>Safe trip, ' + esc(S.user.name) + '.</p></div>';
    else h += '<div class="hero"><p class="lbl">YOUR POSITION</p><div class="big" style="font-size:2.4rem">NOT IN QUEUE</div></div>';
    if (S.err) h += '<p class="banner" role="alert">' + esc(S.err) + '</p>';
    h += routeSelect('droute', S.droute, !!mine);
    h += '<div style="margin:10px 0">' + (mine ? '<button class="btn r wide" data-a="leave">Leave queue</button>' : gone ? '<button class="btn g wide" data-a="rejoin" data-v="' + gone.id + '">Rejoin queue</button>' : '<button class="btn g wide" data-a="checkin">Check into queue</button>') + '</div>';
    h += '<div class="card"><p class="lbl" style="margin:0">AVAILABLE WALLET BALANCE</p><div class="amt">' + rand(S.balance) + '</div><p class="mute" style="margin:2px 0 8px">R2.00 is taken when you accept a dispatch.</p>' +
        '<div class="row"><input class="field" id="tu" placeholder="Top-up code" autocapitalize="characters" autocomplete="off" style="flex:1;margin:0"><button class="btn sm" data-a="redeem">Redeem</button></div></div>';
    return h;
}
/* ---------- Owner dashboard ---------- */
const SAST = 2 * 3600 * 1000;
const dayStr = (ms) => new Date(ms + SAST).toISOString().slice(0, 10);
const shiftDay = (d, n) => dayStr(new Date(d + 'T12:00:00+02:00').getTime() + n * 86400000);
const niceDate = (d) => new Date(d + 'T12:00:00+02:00').toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Africa/Johannesburg' });
const clock = (iso) => new Date(iso).toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Johannesburg' });
async function fetchOwner() {
    if (!S.user || S.user.role !== 'owner') return;
    if (!S.od) S.od = dayStr(Date.now());
    const r = await api('GET', '/api/owner/summary?date=' + S.od);
    if (r.ok) { S.odata = r.data; render(); } else toast(fail(r, 'Could not load trips'));
}
function ownerView() {
    const d = S.odata;
    let h = '<h2 style="margin-top:0">Trips accepted</h2><div class="row"><button class="btn sm" data-a="oPrev">&#9664; Day before</button><input class="field" type="date" id="odate" value="' + esc(S.od) + '" style="width:auto;margin:0"><button class="btn sm" data-a="oNext">Next day &#9654;</button><button class="btn a sm" data-a="oToday">Today</button><button class="btn sm" data-a="oRefresh">Refresh</button></div>';
    if (!d) return h + '<p class="mute">Loading...</p>';
    h += '<div class="hero"><p class="lbl">ALL YOUR DRIVERS · ' + esc(niceDate(d.date)).toUpperCase() + '</p><div class="big">' + d.total + '</div><p>trips accepted through RankFlow</p></div>';
    if (!d.drivers.length) h += '<p class="mute">No drivers are linked to you yet. Ask RankFlow to link your drivers to your ID.</p>';
    h += '<p class="mute">Only trips accepted in RankFlow are counted. Use these numbers to check your driver\'s day against the cash he hands in.</p><div class="grid">' + d.drivers.map((x) => {
        const cells = [6, 5, 4, 3, 2, 1, 0].map((n) => { const k = shiftDay(d.date, -n); return '<div>' + new Date(k + 'T12:00:00+02:00').toLocaleDateString('en-ZA', { weekday: 'short', timeZone: 'Africa/Johannesburg' }) + '<b>' + (x.week[k] || 0) + '</b></div>'; }).join('');
        return '<article class="card"><b>' + esc(x.name) + '</b> <span class="mute">' + esc(x.plate) + '</span><div class="amt">' + x.trips + ' trip' + (x.trips === 1 ? '' : 's') + '</div><p class="mute" style="margin:0 0 6px">Rank fees paid: ' + rand(x.fees) + '</p>' +
            (x.list.length ? x.list.map((t) => '<div class="line"><span>' + clock(t.time) + '</span><span class="mute">' + esc(t.route) + '</span></div>').join('') : '<p class="mute">No trips this day.</p>') +
            '<p class="lbl" style="margin:10px 0 0">LAST 7 DAYS</p><div class="wk">' + cells + '</div></article>';
    }).join('') + '</div>';
    return h;
}

/* ---------- Admin (you only) ---------- */
async function fetchAdmin() {
    if (!S.user || S.user.role !== 'admin') return;
    const [u, b, p] = await Promise.all([api('GET', '/api/admin/users'), api('GET', '/api/admin/batches'), api('GET', '/api/admin/payments')]);
    if (u.ok) S.ausers = u.data.users; if (b.ok) S.abatches = b.data.batches; if (p.ok) S.apays = p.data.payments;
    if (!u.ok) toast(fail(u, 'Could not load')); render();
}
function adminView() {
    const tabs = [['users', 'Drivers and owners'], ['codes', 'Top-up codes'], ['pay', 'Confirm a payment']];
    let h = '<div class="tabs">' + tabs.map((t) => '<button class="btn sm' + (S.tab === t[0] ? ' a' : '') + '" data-a="atab" data-v="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>';
    if (S.aout) h += '<div class="ok">' + S.aout + '<div style="margin-top:8px"><button class="btn sm" data-a="aclear">Done, hide this</button></div></div>';
    if (S.tab === 'users') {
        h += '<h2 style="margin-top:0">Add someone</h2><div class="form"><select class="field" id="arole"><option value="driver">Driver</option><option value="owner">Owner</option><option value="manager">Rank manager</option></select>' +
            '<input class="field" id="aid" placeholder="ID, e.g. DRV002" autocapitalize="characters"><input class="field" id="aname" placeholder="Full name"><input class="field" id="aplate" placeholder="Number plate (drivers only)" autocapitalize="characters">' +
            '<input class="field" id="aowner" placeholder="Owner ID (drivers, optional), e.g. OWN001" autocapitalize="characters"><input class="field" id="apin" inputmode="numeric" maxlength="4" placeholder="4-digit PIN (leave empty to make one)">' +
            '<button class="btn g" data-a="aCreate">Create</button></div><h2>Everyone</h2>' +
            S.ausers.map((u) => '<div class="line"><span><b>' + esc(u.id) + '</b> ' + esc(u.full_name) + ' <span class="mute">' + u.role + (u.plate ? ' · ' + esc(u.plate) : '') + (u.owner_id ? ' · owner ' + esc(u.owner_id) : '') + '</span></span><span>' + (u.balance == null ? '' : rand(u.balance)) + (u.role !== 'admin' ? ' <button class="btn sm" data-a="aReset" data-v="' + esc(u.id) + '">New PIN</button>' : '') + '</span></div>').join('');
    } else if (S.tab === 'codes') {
        h += '<h2 style="margin-top:0">Make top-up codes</h2><p class="mute">Create codes only after the seller has paid you. Each code works once.</p><div class="form"><input class="field" id="cseller" placeholder="Seller\'s name"><input class="field" id="camt" type="number" inputmode="decimal" placeholder="Value of each code (R)"><input class="field" id="ccount" type="number" inputmode="numeric" placeholder="How many codes"><input class="field" id="cref" placeholder="Bank reference of their payment"><button class="btn g" data-a="cCreate">Make codes</button></div><h2>Recent batches</h2>' +
            (S.abatches.length ? S.abatches.map((b) => { const unused = b.codes.filter((c) => !c.used_at).length;
                return '<details class="card" style="margin-bottom:8px"><summary><b>' + esc(b.seller) + '</b> · ' + b.quantity + ' × ' + rand(b.amount) + ' · <span class="mute">' + unused + ' unused · ' + new Date(b.created_at).toLocaleDateString('en-ZA') + (b.reference ? ' · ' + esc(b.reference) : '') + '</span></summary>' +
                    b.codes.map((c) => '<div class="line"><span class="mono">' + esc(c.code) + '</span><span class="mute">' + (c.used_at ? 'used by ' + esc(c.used_by) : 'unused') + '</span></div>').join('') + '</details>'; }).join('') : '<p class="mute">No codes made yet.</p>');
    } else {
        h += '<h2 style="margin-top:0">Confirm a payment</h2><p class="mute">Only add money you can already see in your bank account.</p><div class="form"><input class="field" id="puser" list="drv" placeholder="Driver ID" autocapitalize="characters"><datalist id="drv">' + S.ausers.filter((u) => u.role === 'driver').map((u) => '<option value="' + esc(u.id) + '">' + esc(u.full_name) + '</option>').join('') + '</datalist>' +
            '<input class="field" id="pamt" type="number" inputmode="decimal" placeholder="Amount (R)"><select class="field" id="pmeth"><option>PayShap</option><option>EFT</option><option>eWallet</option><option>Cash</option></select><input class="field" id="pref" placeholder="Bank reference (not needed for cash)"><button class="btn g" data-a="pCreate">Add to wallet</button></div><h2>Recent payments</h2>' +
            (S.apays.length ? S.apays.map((p) => '<div class="line"><span><b>' + esc(p.user_id) + '</b> ' + esc(p.method) + (p.reference ? ' · ' + esc(p.reference) : '') + '<br><span class="mute">' + new Date(p.created_at).toLocaleString('en-ZA') + '</span></span><b>' + rand(p.amount) + '</b></div>').join('') : '<p class="mute">No payments yet.</p>');
    }
    return h;
}

function render() {
    $('who').innerHTML = S.user ? '<span class="mute">' + esc(S.user.name || S.user.id) + ' · ' + S.user.role + '</span> <button class="btn sm" data-a="logout">Log out</button>' : '';
    $('app').innerHTML = !S.user ? loginView() : S.user.role === 'manager' ? managerView() : S.user.role === 'owner' ? ownerView() : S.user.role === 'admin' ? adminView() : driverView();
}
function softRender() { const t = document.activeElement && document.activeElement.tagName; if (t === 'INPUT' || t === 'SELECT') return; render(); }

/* ---------- Queue polling ---------- */
async function fetchQueue() {
    if (!S.user || !['manager', 'driver'].includes(S.user.role)) return;
    const r = await api('GET', '/api/queue?route=' + encodeURIComponent(S.user.role === 'manager' ? S.route : S.droute));
    if (!r.ok || !S.user) return;
    S.queue = r.data.queue || []; S.recent = r.data.recent || [];
    handleOffer();
    const sig = JSON.stringify([S.queue, S.recent, S.err, S.addOpen]);
    if (sig !== S.sig) { S.sig = sig; softRender(); }
}
setInterval(() => { if (S.user && !document.hidden) fetchQueue(); }, 2500);

function handleOffer() {
    const me = S.user && S.user.role === 'driver' ? S.queue.find((e) => e.driver_id === S.user.id && e.status === 'Offered') : null;
    if (me) {
        const end = Date.now() + me.secondsLeft * 1000;
        if (!S.offerEnd || Math.abs(end - S.offerEnd) > 2000) S.offerEnd = end;
        $('alertPlate').textContent = me.plate + ' · ' + me.route;
        $('alertBox').className = 'on'; tickAlert();
    } else { S.offerEnd = 0; $('alertBox').className = ''; }
}
const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function tickAlert() {
    const s = Math.max(0, Math.ceil((S.offerEnd - Date.now()) / 1000));
    $('alertSecs').textContent = mmss(s); $('alertSecs').className = s <= 20 ? 'low' : '';
    if (s <= 0 && S.offerEnd) { S.offerEnd = 0; $('alertBox').className = ''; fetchQueue(); }
}
setInterval(() => { if (S.offerEnd) tickAlert(); }, 250);

/* ---------- PIN pad ---------- */
let pinValue = '', pinSubmit = null, pinBusy = false;
$('keys').innerHTML = ['1','2','3','4','5','6','7','8','9','C','0','⌫'].map((k) => '<button class="key' + (k === 'C' || k === '⌫' ? ' fn' : '') + '" data-a="pk" data-v="' + k + '" aria-label="' + (k === 'C' ? 'Clear' : k === '⌫' ? 'Backspace' : k) + '">' + k + '</button>').join('');
function dots() { const d = $('dots').children; for (let i = 0; i < 4; i++) d[i].className = i < pinValue.length ? 'f' : ''; }
function openPin(title, submit) { pinValue = ''; pinSubmit = submit; pinBusy = false; $('pdesc').textContent = title; $('deny').className = 'deny'; dots(); $('pin').className = 'on'; }
function closePin() { $('pin').className = 'on out'; setTimeout(() => { $('pin').className = ''; }, 300); pinSubmit = null; }
function pinKey(v) {
    if (pinBusy || !pinSubmit) return;
    if (v === 'C') pinValue = ''; else if (v === '⌫') pinValue = pinValue.slice(0, -1); else if (pinValue.length < 4) pinValue += v;
    $('deny').className = 'deny'; dots();
    if (pinValue.length === 4) { pinBusy = true; setTimeout(async () => {
        const ok = await pinSubmit(pinValue);
        if (ok === true) return closePin();
        const sh = $('sheet'); sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake');
        if (ok === false) $('deny').className = 'deny on';
        pinValue = ''; pinBusy = false; dots();
    }, 150); }
}

/* ---------- Login ---------- */
async function doLogin(id, pin) {
    const r = await api('POST', '/api/auth/verify-pin', { userId: id, pin });
    if (r.network) { toast('Cannot reach the server. Wait a minute and try again.'); return null; }
    if (r.status === 429) { toast(r.data.message || 'Too many wrong tries. Please wait 15 minutes.'); return null; }
    if (r.status === 401 || r.status === 404) return false;
    if (!r.ok) { toast('Server error (' + r.status + ')'); return null; }
    S.user = r.data.user; S.token = r.data.token; S.balance = r.data.balance; S.err = ''; S.sig = '';
    if (S.user.role === 'manager' || !S.droute) S.droute = ROUTES[0];
    save(); render(); fetchQueue(); fetchOwner(); fetchAdmin();
    return true;
}

/* ---------- Actions ---------- */
async function act(path, body, okMsg) {
    S.err = ''; const r = await api('POST', path, body);
    if (!r.ok) { S.err = fail(r); render(); return r; }
    if (okMsg) toast(okMsg);
    await fetchQueue(); render(); return r;
}
const A = {
    enterPin() { const id = $('uid').value.trim().toUpperCase(); S.uid = id; if (!id) { S.err = 'Enter your ID first'; render(); return; } S.err = ''; openPin('PIN for ' + id, (pin) => doLogin(id, pin)); },
    logout() { logout(''); },
    mroute() { S.route = $('mroute').value; S.sig = ''; save(); fetchQueue(); },
    droute() { S.droute = $('droute').value; S.sig = ''; save(); fetchQueue(); },
    async dispatchNext() { S.busy = true; render(); await act('/api/queue/dispatch-next', { route: S.route }); S.busy = false; render(); },
    addOpen() { S.addOpen = true; render(); }, addCancel() { S.addOpen = false; render(); },
    async addOk() { const plate = $('np').value.trim(); if (plate.length < 4) { toast('Enter the number plate'); return; } S.addOpen = false; await act('/api/queue/join', { route: S.route, plate, driverName: $('nd').value.trim() }); },
    brk(v) { act('/api/queue/break', { id: Number(v) }); },
    skip(v) { act('/api/queue/skip', { id: Number(v) }, 'Offer cancelled. Taxi moved to the back.'); },
    remove(v) { act('/api/queue/remove', { id: Number(v) }); },
    rejoin(v) { act('/api/queue/rejoin', { id: Number(v) }); },
    checkin() { act('/api/queue/join', { route: S.droute }, 'You are in the queue'); },
    leave() { act('/api/queue/leave', {}); },
    async accept() { $('alertBox').className = ''; S.offerEnd = 0; const r = await act('/api/queue/accept', {}); if (r.ok && typeof r.data.balance === 'number') { S.balance = r.data.balance; save(); toast('Trip accepted. R2.00 fee taken.'); render(); } },
    reject() { $('alertBox').className = ''; S.offerEnd = 0; act('/api/queue/reject', {}, 'Moved to the back of the queue'); },
    async redeem() {
        const code = $('tu').value.trim(); if (code.length < 6) { toast('Enter your top-up code'); return; }
        const r = await api('POST', '/api/wallet/redeem', { code });
        if (!r.ok) { toast(fail(r, 'Code not accepted')); return; }
        S.balance = r.data.balance; save(); toast(rand(r.data.added) + ' added to your wallet'); render();
    },
    oPrev() { S.od = shiftDay(S.od, -1); fetchOwner(); }, oNext() { S.od = shiftDay(S.od, 1); fetchOwner(); },
    oToday() { S.od = dayStr(Date.now()); fetchOwner(); }, oRefresh() { fetchOwner(); },
    atab(v) { S.tab = v; S.aout = ''; render(); }, aclear() { S.aout = ''; render(); },
    async aCreate() {
        const body = { role: $('arole').value, id: $('aid').value, name: $('aname').value, plate: $('aplate').value, ownerId: $('aowner').value, pin: $('apin').value };
        const r = await api('POST', '/api/admin/users', body); if (!r.ok) { toast(fail(r)); return; }
        S.aout = 'Created ' + esc(r.data.name) + ' (' + r.data.role + '). ID: <span class="mono">' + esc(r.data.id) + '</span> PIN: <span class="mono">' + esc(r.data.pin) + '</span><br><span class="mute">Give them this now. The PIN is not shown again.</span>'; fetchAdmin();
    },
    async aReset(v) {
        const r = await api('POST', '/api/admin/reset-pin', { id: v }); if (!r.ok) { toast(fail(r)); return; }
        S.aout = 'New PIN for <b>' + esc(r.data.id) + '</b>: <span class="mono">' + esc(r.data.pin) + '</span><br><span class="mute">Give it to them now. It is not shown again.</span>'; render();
    },
    async cCreate() {
        const r = await api('POST', '/api/admin/codes', { seller: $('cseller').value, amount: $('camt').value, count: $('ccount').value, reference: $('cref').value }); if (!r.ok) { toast(fail(r)); return; }
        S.aout = r.data.codes.length + ' codes of ' + rand(r.data.batch.amount) + ' for ' + esc(r.data.batch.seller) + ':<div class="mono" style="margin-top:6px">' + r.data.codes.map(esc).join('<br>') + '</div>'; fetchAdmin();
    },
    async pCreate() {
        const r = await api('POST', '/api/admin/payments', { userId: $('puser').value, amount: $('pamt').value, method: $('pmeth').value, reference: $('pref').value }); if (!r.ok) { toast(fail(r)); return; }
        S.aout = 'Added. The wallet now holds ' + rand(r.data.balance) + '.'; fetchAdmin();
    },
    pk(v) { pinKey(v); },
    pcancel() { closePin(); }
};
document.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (b && b.tagName !== 'SELECT' && A[b.dataset.a]) A[b.dataset.a](b.dataset.v); });
document.addEventListener('change', (e) => { if (e.target.id === 'odate' && e.target.value) { S.od = e.target.value; fetchOwner(); return; } const b = e.target.closest('select[data-a]'); if (b) A[b.dataset.a](); });
document.addEventListener('input', (e) => { if (e.target.id === 'uid') S.uid = e.target.value; });
document.addEventListener('keydown', (e) => {
    if ($('pin').className.indexOf('on') > -1) { if (/^[0-9]$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('⌫'); else if (e.key === 'Escape') closePin(); }
    else if (e.key === 'Enter' && !S.user && e.target.id === 'uid') A.enterPin();
});

/* ---------- Start ---------- */
function updateOnline() { $('offlineBar').style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', () => { updateOnline(); checkServer(); }); window.addEventListener('offline', updateOnline); updateOnline();
try { const s = JSON.parse(sessionStorage.getItem('rf') || 'null'); if (s && s.token) { S.user = s.user; S.token = s.token; S.balance = s.balance; S.droute = s.droute || ROUTES[0]; S.route = s.route || ROUTES[0]; } } catch (e) {}
render(); checkServer(); fetchQueue(); fetchOwner(); fetchAdmin();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
